# Everything that can go wrong, often. Use it to prove your retry logic before production does it for you.
# Faults roll independently per request, so a run of retries can fail several times in a row.
name: Flaky APIs
description: >
  Heavy fault rates on every vendor, with real OAuth checks. QuickBooks throttles nearly a third of requests
  (429), is sometimes unavailable (503), and loses the answer to some writes after making them (504).
  Jobber's DDoS guard throttles one request in five (429) and its gateway sometimes fails (502), and its
  webhooks come twice or late. Housecall Pro throttles one request in five (429, with RateLimit-Reset), its
  gateway sometimes fails (502), it loses the answer to some writes after making them (504), and some of its
  webhooks come late. Every QuickBooks response is a little slow.
seed: 42
startTime: "2026-07-13T11:00:00Z"
auth: oauth
faults:
  # First, so every write gets its own chance at it. The write happens, then its answer is lost: retry without a
  # requestid and it happens twice.
  - name: qbo-lost-answers
    vendor: quickbooks
    method: POST
    rate: 0.15
    effect: { status: 504, message: "Gateway timeout", lostResponse: true }
  - name: qbo-throttled
    vendor: quickbooks
    rate: 0.3
    effect: { status: 429, message: "ThrottleExceeded" }
  - name: qbo-unavailable
    vendor: quickbooks
    rate: 0.1
    effect: { status: 503, message: "Service temporarily unavailable" }
  - name: jobber-ddos-guard
    vendor: jobber
    pathIncludes: /api/graphql # the OAuth endpoints stay up, so token refresh still works
    rate: 0.2
    effect: { status: 429 }
  - name: jobber-bad-gateway
    vendor: jobber
    pathIncludes: /api/graphql
    rate: 0.05
    effect: { status: 502, message: "Bad gateway" }
  - name: everything-a-little-slow
    vendor: quickbooks
    rate: 1
    effect: { latencyMs: 5 }
  # For apps subscribed to webhooks: Jobber's documented repeats, and some late enough to arrive out of order.
  - name: jobber-webhooks-twice
    vendor: jobber
    webhook: "*"
    rate: 0.3
    effect: { duplicate: true }
  - name: jobber-webhooks-late
    vendor: jobber
    webhook: "*"
    rate: 0.3
    effect: { delayMs: 300000 }
  # Housecall Pro publishes no limits, only that a 429 says when to try again in RateLimit-Reset, which the twin sends.
  # Its OAuth endpoints share the API's prefix here, and stay up, so connecting and refreshing still work. The lost
  # answers come first, so every write gets its own chance at one: Housecall Pro takes no idempotency key, so look
  # for the customer or job before making it again.
  - name: hcp-lost-answers
    vendor: housecallpro
    method: POST
    pathExcludes: /oauth/
    rate: 0.1
    effect: { status: 504, message: "Gateway timeout", lostResponse: true }
  - name: hcp-throttled
    vendor: housecallpro
    pathExcludes: /oauth/
    rate: 0.2
    effect: { status: 429 }
  - name: hcp-bad-gateway
    vendor: housecallpro
    pathExcludes: /oauth/
    rate: 0.05
    effect: { status: 502, message: "Bad gateway" }
  # Housecall Pro tries each webhook once and promises no order: some come late enough to arrive after later ones.
  - name: hcp-webhooks-late
    vendor: housecallpro
    webhook: "*"
    rate: 0.2
    effect: { delayMs: 300000 }
timeline:
  # Customers keep paying while your sync struggles.
  - at: "+30m"
    jobber: { payInvoices: 2 }
    housecallpro: { payInvoices: 2 } # the same two invoices, #23 and #25, as each system has them
