# The field-service systems (Jobber and Housecall Pro) and QuickBooks disagree, the way they do in real businesses.
# Use it to test how your sync matches customers across systems: exact names won't always work.
name: Mismatched books
description: >
  An electrician whose books have drifted from the field. Three customers are spelled differently in QuickBooks
  (same email address), two new customers exist only in Jobber and Housecall Pro with work QuickBooks has never
  seen, two customers exist only in QuickBooks, and one customer the bookkeeper made inactive has called again
  and paid for new work.
seed: 21
startTime: "2026-07-13T12:00:00Z"
world:
  customers: 30
  drift:
    renamedInAccounting: 3 # "Lindqvist" in the field, "Lindquist" in QuickBooks
    fieldServiceOnly: 2 # jobs and invoices in Jobber and Housecall Pro, unknown to QuickBooks
    accountingOnly: 2 # in the books, never in the field
    inactiveInAccounting: 1 # inactive in QuickBooks, but paid for a job in the field this week
